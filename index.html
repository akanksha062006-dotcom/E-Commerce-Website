
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - E-Commerce Website</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">ShopEase</div>

    <input type="text" id="search"
        placeholder="Search products...">

    <button class="cart-btn" onclick="toggleCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Welcome to ShopEase</h1>
    <p>Discover amazing products at the best prices!</p>
</section>

<main class="container">

    <div class="filters">
        <h2>Our Products</h2>

        <select id="category">
            <option value="All">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Fashion">Fashion</option>
            <option value="Accessories">Accessories</option>
            <option value="Groceries">Groceries</option>

        </select>
    </div>

    <div class="products" id="products"></div>

</main>

<section class="cart-section" id="cartSection">

    <h2>Shopping Cart</h2>

    <div id="cartItems"></div>

    <div class="total">
        Total: ₹<span id="total">0</span>
    </div>

    <button class="checkout-btn" onclick="openCheckout()">
        Proceed to Checkout
    </button>

</section>

<section class="checkout" id="checkout">

    <h2>Checkout Details</h2>

    <form id="checkoutForm">

        <input type="text" id="customerName"
            placeholder="Full Name" required>

        <input type="email" id="email"
            placeholder="Email Address" required>

        <input type="tel" id="phone"
            placeholder="Phone Number"
            pattern="[0-9]{10}" required>

        <textarea id="address"
            placeholder="Delivery Address" required></textarea>

        <h3>Payment Method</h3>

        <select id="payment" required>
            <option value="">Select Payment Method</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="UPI (Demo)">UPI (Demo)</option>
        </select>

        <button type="submit" class="checkout-btn">
            Place Order
        </button>

    </form>

</section>

<footer>
    <p>© 2026 ShopEase | SRMU</p>
</footer>

<script src="script.js"></script>

</body>
</html>
